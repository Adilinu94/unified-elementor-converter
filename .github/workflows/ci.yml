name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npx tsc --build

  ability-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --build --pretty false
      - name: Live ability drift check
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
          MCP_AUTH: ${{ secrets.MCP_AUTH }}
        run: |
          npx tsx scripts/check-drift.ts 2>&1 | tee drift.log
          echo "--- drift.log ---"; cat drift.log

  visual-regression:
    # Phase 112: pixel-diff a deterministic local fixture against the
    # committed baseline (tests/visual/baseline). Fails on unintended drift;
    # refresh intentionally with UPDATE_BASELINE=1 locally and commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run tests/visual --test-timeout=90000
